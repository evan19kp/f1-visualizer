# Local dev infrastructure. Postgres host port is 5433 (see README — not 5432).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: f1
      POSTGRES_USER: f1user
      POSTGRES_PASSWORD: f1pass
    ports:
      - "5433:5432"  # host 5433 → container 5432; app DB_URL defaults to localhost:5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1user -d f1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/f1
      DB_USER: f1user
      DB_PASSWORD: f1pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: docker-local-jwt-secret-min-32-chars
      ADMIN_USER: admin
      ADMIN_PASSWORD: docker-local-admin-pass
      WEBSOCKET_ALLOWED_ORIGINS: http://localhost:5173
      INGESTION_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:

# Production profile — secrets and origins come from environment variables only.

spring:
  jpa:
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
    info:
      enabled: false

app:
  ingestion:
    enabled: ${INGESTION_ENABLED:false}
  insights:
    store: redis
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:}

logging:
  level:
    com.evanp.f1: INFO
    org.hibernate.SQL: WARN

spring:
  application:
    name: f1-visualizer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/f1}
    username: ${DB_USER:f1user}
    password: ${DB_PASSWORD:f1pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:changeme}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
    info:
      enabled: true
  info:
    env:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_MIN_256_BITS}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    enabled: ${AI_ENABLED:false}
    poll-interval-ms: ${AI_POLL_INTERVAL_MS:5000}
  insights:
    store: ${INSIGHTS_STORE:memory}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    rate-limit-seconds: 30
  openf1:
    base-url: ${OPENF1_BASE_URL:https://api.openf1.org/v1}
    token-url: ${OPENF1_TOKEN_URL:https://api.openf1.org/token}
    access-token: ${OPENF1_ACCESS_TOKEN:}
    username: ${OPENF1_USERNAME:}
    password: ${OPENF1_PASSWORD:}
    token-failure-cooldown-ms: ${OPENF1_TOKEN_FAILURE_COOLDOWN_MS:30000}
    # OpenF1 free tier allows max 30 requests/minute; 2500ms (~24/min) stays under the cap.
    poll-interval-ms: ${OPENF1_POLL_INTERVAL_MS:2500}
  ingestion:
    enabled: ${INGESTION_ENABLED:false}
    session-key: ${OPENF1_SESSION_KEY:latest}
  s3:
    bucket: ${S3_BUCKET:f1-visualizer-assets}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT_URL:}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:}
  dev:
    enabled: ${DEV_MODE:false}
    track-mesh-root: ${TRACK_MESH_ROOT:tools/track-mesh}

logging:
  level:
    com.evanp.f1: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

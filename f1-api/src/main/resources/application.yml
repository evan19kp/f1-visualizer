spring:
  application:
    name: f1-visualizer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/f1}
    username: ${DB_USER:f1user}
    password: ${DB_PASSWORD:f1pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:changeme}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_MIN_256_BITS}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    enabled: ${AI_ENABLED:false}
    poll-interval-ms: ${AI_POLL_INTERVAL_MS:5000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    rate-limit-seconds: 30
  openf1:
    base-url: ${OPENF1_BASE_URL:https://api.openf1.org/v1}
    poll-interval-ms: ${OPENF1_POLL_INTERVAL_MS:1000}
  ingestion:
    enabled: ${INGESTION_ENABLED:false}
    session-key: ${OPENF1_SESSION_KEY:latest}
  s3:
    bucket: ${S3_BUCKET:f1-visualizer-assets}
    region: ${AWS_REGION:us-east-1}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

logging:
  level:
    com.evanp.f1: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
